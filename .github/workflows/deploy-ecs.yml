name: Build and Deploy Notification Service

on:
  push:
    branches: [feature/notification-service]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_NAME: cuidado-seguro-notification-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify application
        run: mvn -B -DskipTests package

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy image revision to ECS
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          IMAGE_URI: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --query taskDefinition > task-definition.json
          jq \
            --arg image "$IMAGE_URI" \
            --arg rabbitmqHost "$RABBITMQ_HOST" \
            --arg rabbitmqPort "$RABBITMQ_PORT" \
            --arg rabbitmqUsername "$RABBITMQ_USERNAME" \
            --arg rabbitmqPassword "$RABBITMQ_PASSWORD" \
            --arg mailUsername "$MAIL_USERNAME" \
            --arg mailPassword "$MAIL_PASSWORD" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .enableFaultInjection)
            | .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) | map(select(.name != "RABBITMQ_HOST" and .name != "RABBITMQ_PORT" and .name != "RABBITMQ_USERNAME" and .name != "RABBITMQ_PASSWORD" and .name != "MAIL_USERNAME" and .name != "MAIL_PASSWORD")) + [
                {name: "RABBITMQ_HOST", value: $rabbitmqHost},
                {name: "RABBITMQ_PORT", value: $rabbitmqPort},
                {name: "RABBITMQ_USERNAME", value: $rabbitmqUsername},
                {name: "RABBITMQ_PASSWORD", value: $rabbitmqPassword},
                {name: "MAIL_USERNAME", value: $mailUsername},
                {name: "MAIL_PASSWORD", value: $mailPassword}
              ])' \
            task-definition.json > next-task-definition.json
          NEXT_TASK_DEFINITION_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEXT_TASK_DEFINITION_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
